<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Project — To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>My To-Do List</h1>
    <p class="subtitle">Your first vibe-coded project 🎉</p>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="What do you need to do?" autocomplete="off" required />
      <select id="task-tag" aria-label="Tag">
        <option value="">No tag</option>
        <option value="school">School</option>
        <option value="health">Health</option>
        <option value="personal">Personal</option>
      </select>
      <label class="date-field">From <input type="date" id="task-start" aria-label="Start date" /></label>
      <label class="date-field">To <input type="date" id="task-end" aria-label="End date" /></label>
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>

    <p id="empty-state">Nothing here yet — add your first task above.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
